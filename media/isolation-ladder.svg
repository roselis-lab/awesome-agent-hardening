<svg xmlns="http://www.w3.org/2000/svg" width="680" height="696" viewBox="0 0 680 696" role="img" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Two nodes: an orchestrator node that holds the tokens and a sandbox node that runs the code</title>
  <desc>The agent orchestrator holds the tokens (LLM, MCP) and drives the loop on its own node, the trusted side. Over a single channel it sends code and data down and gets a JSON result back. On a separate sandbox node, a supervisor that holds no tokens builds the sandbox, feeds it code and takes results. Untrusted agent code runs inside a swappable isolation boundary: a container step is runc or gVisor via Docker, Podman or LXC (weaker), a microVM step is Firecracker or libkrun and needs KVM (stronger). Each node sits on its own host kernel. Because the tokens stay on the orchestrator node, a sandbox escape reaches only the sandbox node. Kubernetes places both nodes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="600" height="606" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="56" y="64" font-size="14" font-weight="500" fill="#2C2C2A">Kubernetes (optional)</text>
  <text x="56" y="82" font-size="12" fill="#5F5E5A">schedules the pods on two nodes, picks the runtime</text>

  <!-- Node A: agent orchestrator node (trusted) -->
  <rect x="70" y="96" width="540" height="152" rx="12" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
  <text x="86" y="120" font-size="14" font-weight="500" fill="#2C2C2A">Agent orchestrator node (trusted)</text>

  <rect x="90" y="134" width="500" height="54" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="155" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">Agent orchestrator</text>
  <text x="340" y="174" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">holds tokens (LLM, MCP), drives the loop</text>

  <rect x="90" y="200" width="500" height="36" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="220" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Host kernel</text>

  <!-- Channel: the only link between the nodes -->
  <line x1="324" y1="260" x2="324" y2="320" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="356" y1="320" x2="356" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="284" font-size="12" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">code + data</text>
  <text x="380" y="284" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">JSON result</text>
  <text x="340" y="334" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">the only link between the nodes</text>

  <!-- Node B: sandbox node -->
  <rect x="70" y="344" width="540" height="290" rx="12" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
  <text x="86" y="368" font-size="14" font-weight="500" fill="#2C2C2A">Sandbox node</text>

  <rect x="90" y="382" width="500" height="54" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="403" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">Sandbox supervisor (no tokens)</text>
  <text x="340" y="422" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">builds the sandbox, feeds code, takes results</text>

  <line x1="340" y1="440" x2="340" y2="456" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="458" width="500" height="112" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="477" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">Boundary (swap one step)</text>
  <rect x="110" y="490" width="460" height="32" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="340" y="506" font-size="14" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">Untrusted agent code runs in here</text>
  <text x="340" y="538" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">container: runc or gVisor via Docker/Podman/LXC (weaker)</text>
  <text x="340" y="556" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">microVM: Firecracker or libkrun, needs KVM (stronger)</text>

  <rect x="90" y="582" width="500" height="40" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="602" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Host kernel and hardware (shared)</text>

  <!-- the thought, as a neat line below the diagram -->
  <text x="340" y="666" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">The tokens stay on the orchestrator node;</text>
  <text x="340" y="684" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">a sandbox escape reaches only the sandbox node.</text>
</svg>
